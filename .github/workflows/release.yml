name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # Cross-compiled from ARM: the macos-13 image is retired and every
          # current macOS runner is ARM.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The action reads `packageManager` only from the repo root, and this
      # repo's package.json is in web/. Keep in step with it.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          # GITHUB_REF_NAME would be the branch on a manual run.
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          name="diffuse-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/diffuse.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/diffuse" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          openssl dgst -sha256 -r "$name.${{ matrix.archive }}" > "$name.${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Find the previous tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # By ancestry, not tag date — and empty on the first release.
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          echo "PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"
          echo "previous tag: ${prev:-<none>}"

      # Preferred over GitHub's own generate_release_notes for the shape of the
      # output: entries grouped by type and each one linked to its commit.
      - name: Build the changelog
        id: changelog
        uses: requarks/changelog-action@v1.10.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fromTag: ${{ inputs.tag || github.ref_name }}
          toTag: ${{ env.PREVIOUS_TAG }}
          writeToFile: false

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "diffuse: ${{ inputs.tag || github.ref_name }}"
          draft: true
          body: |
            Read the [docs](https://github.com/${{ github.repository }}/blob/${{ inputs.tag || github.ref_name }}/README.md) before running.

            ${{ steps.changelog.outputs.changes }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
