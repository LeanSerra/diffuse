[package]
name = "diffuse"
version = "0.1.0"
edition = "2021"
description = "A browser-based pager for git's diff output"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
mime_guess = "2"
opener = "0.8"
# `default-fancy` swaps onig (a C dependency) for the pure-Rust fancy-regex,
# so diffuse still builds and ships as a single static binary.
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
getrandom = "0.4"
tokio-stream = "0.1"
# Highlighting one file is independent of every other, so the whole-diff
# stream fans out across cores instead of trickling out one file at a time.
rayon = "1"
futures-core = "0.3"

[dev-dependencies]
insta = { version = "1", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
strip = true
