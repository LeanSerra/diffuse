<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">diffuse</title>
  <defs>
    <!-- Removed above, added below, in the colours of a diff row. The neutral
         middle stop keeps red and green from blending into mud. -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8c6d0"/>
      <stop offset="0.5" stop-color="#f2efec"/>
      <stop offset="1" stop-color="#c3e9d4"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none"
        stroke="#000" stroke-opacity="0.10"/>

  <!-- minus -->
  <rect x="20" y="13" width="24" height="6" rx="3" fill="#c02434"/>
  <!-- plus -->
  <rect x="20" y="36" width="24" height="6" rx="3" fill="#0f7a44"/>
  <rect x="29" y="27" width="6" height="24" rx="3" fill="#0f7a44"/>
</svg>
